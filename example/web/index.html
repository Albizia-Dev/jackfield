<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Demonstrates how to use the jackfield plugin.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="jackfield_example">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>jackfield_example</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="assets/packages/jackfield/web/jackfield_bridge.js"></script>
  <script>
    window.JackfieldHostWorkerRegistration = (async () => {
      if (!('serviceWorker' in navigator)) throw new Error('service worker unavailable');
      const url = new URL('jackfield_host_worker.js', document.baseURI);
      const registered = await navigator.serviceWorker.register(url.href);
      const ready = await navigator.serviceWorker.ready;
      if (ready.scope !== registered.scope || ready.active?.scriptURL !== url.href) {
        throw new Error('Jackfield host worker is not active for this page');
      }
      return ready;
    })();
    window.JackfieldHostWorkerRegistration.then(() => {
      const bootstrap = document.createElement('script');
      bootstrap.src = 'flutter_bootstrap.js';
      document.body.appendChild(bootstrap);
    });
  </script>
</body>
</html>
