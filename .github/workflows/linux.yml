name: Linux scaffold contract only
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: linux-scaffold-${{ github.ref }}
  cancel-in-progress: true
jobs:
  linux-scaffold:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true
      - run: tool/verify.sh linux-scaffold
